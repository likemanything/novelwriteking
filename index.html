<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="墨织 Inkloom：面向团队的 AI 长篇小说创作工作台，从一句灵感写成一部长篇。" />
    <meta name="theme-color" content="#f3eee3" />
    <title>墨织 Inkloom · AI 长篇小说创作</title>
    <script>
      // 在首帧之前应用主题，避免闪烁
      try {
        const s = JSON.parse(localStorage.getItem('inkloom.settings') || '{}');
        const theme = s.state && s.state.theme;
        const dark = theme === 'night' || (theme !== 'paper' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
